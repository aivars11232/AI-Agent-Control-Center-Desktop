# cargo-deny configuration for the release CI gate (TASK-0019).
# Run from the workspace: `cargo deny --manifest-path src-tauri/Cargo.toml check`.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = false

[licenses]
# Permissive licenses that are compatible with proprietary distribution of
# AI Agent Control Center. See THIRD-PARTY-NOTICES.md.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BlueOak-1.0.0",
    "NCSA",
]
confidence-threshold = 0.9
# This list is the Rust half of one policy; `scripts/check-licenses.sh` carries
# the same identifiers plus the extra permissive ones only npm packages use.
# Keeping both in sync matters more than pruning entries that no crate happens
# to carry today, so an allowance the current tree does not exercise
# (BlueOak-1.0.0, NCSA, Unicode-DFS-2016 as of this release candidate) is not a
# finding. Without this, cargo-deny warns on each one on every run.
unused-allowed-license = "allow"
# The workspace crate itself carries the non-SPDX proprietary license via
# `license-file`; it is not a third-party dependency.
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
