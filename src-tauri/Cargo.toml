[package]
name = "ai-agent-control-center"
version = "0.5.1"
description = "Desktop control center for managing AI agents"
authors = ["Aivars Rocens"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ai_agent_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = "=0.32.1"
ashpd = { version = "0.13.13", features = ["remote_desktop", "screencast"] }
log = "0.4"
reqwest = { version = "=0.12.28", default-features = false, features = ["brotli", "deflate", "gzip", "json", "stream", "zstd"] }
sha2 = "=0.10.9"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "=1.53.0", features = ["macros", "net", "rt", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }
libc = "=0.2.186"
rustix = { version = "=1.1.4", features = ["fs"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
